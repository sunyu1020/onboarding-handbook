<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 登陆岛 favicon：奶油色线稿小岛 + 旗帜，与导航栏 logo 风格统一 -->
  <rect width="64" height="64" rx="12" fill="#0a0a0a"/>
  <!-- 海浪线 -->
  <path d="M8 51c4-4 8-4 12 0s8 4 12 0 8-4 12 0 8 4 12 0" fill="none" stroke="rgba(225,224,204,0.45)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 小岛 -->
  <path d="M18 50c0-7 7-15 14-15s14 8 14 15" fill="none" stroke="#E1E0CC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 旗杆 -->
  <path d="M32 35V16" fill="none" stroke="#E1E0CC" stroke-width="3" stroke-linecap="round"/>
  <!-- 旗帜 -->
  <path d="M32 17.5l10 5-10 5z" fill="#E1E0CC"/>
</svg>